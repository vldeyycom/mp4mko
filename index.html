
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Informasi Lengkap</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #e9eef5);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .thumbnail {
            width: 100%;
            height: 230px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 55px;
        }

        .content {
            padding: 28px 24px 30px;
            text-align: center;
        }

        .content h1 {
            margin: 0 0 12px;
            font-size: 25px;
            color: #222;
        }

        .content p {
            margin: 0 auto 25px;
            color: #666;
            line-height: 1.6;
            font-size: 15px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            background: #1877f2;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .note {
            margin-top: 15px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="thumbnail">
            ▶
        </div>

        <div class="content">

            <h1>Informasi Lengkap</h1>

            <p>
                Temukan informasi dan detail selengkapnya.
                Klik tombol di bawah untuk melanjutkan.
            </p>

            <button class="btn" onclick="lanjutkan()">
                Selengkapnya
            </button>

            <div class="note">
                Klik tombol untuk melanjutkan
            </div>

        </div>

    </div>


    <script>

        function lanjutkan() {

            // ==========================================
            // ISI LINK ANDA DI SINI
            // ==========================================

            const linkMonetag =
                "https://hai8g.com/4/11685857";

            const linkShopee =
                "https://s.shopee.co.id/1LfQ2bhplh";


            // ==========================================
            // BUKA DIRECT LINK DI TAB BARU
            // ==========================================

            window.open(
                linkMonetag,
                "_blank"
            );


            // ==========================================
            // BUKA SHOPEE DI TAB SAAT INI
            // ==========================================

            window.location.href = linkShopee;

        }

    </script>

</body>
</html>
